<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaniSim</title>
<meta name="description" content="Farm plan notes, schedules and milestones for the 1.3-acre farm at Sungai Lalah, Pedas.">
<meta name="theme-color" content="#1E4A33" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101712" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TaniSim">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="TaniSim home">
    <img src="icons/icon.svg" alt="" width="34" height="34">
    <span>TaniSim</span>
  </a>
  <span class="net-pill" id="netPill" hidden>Offline · saved notes</span>
  <a class="info-btn" href="#/about" aria-label="About TaniSim" title="About TaniSim">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </a>
  <button class="install-btn" id="installBtn" type="button" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Install app
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Sections">
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V10m0 0c0-4 3-6 7-6 0 4-3 6-7 6Zm0 3c0-3-2-5-6-5 0 3 2 5 6 5ZM5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Today</span>
  </a>
  <a href="#/notes" data-tab="notes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Notes</span>
  </a>
  <a href="#/calendar" data-tab="calendar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8.5" cy="14.5" r="1.3" fill="currentColor"/><circle cx="12" cy="14.5" r="1.3" fill="currentColor"/></svg>
    <span>Calendar</span>
  </a>
  <a href="#/layout" data-tab="layout">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5-9 5zM3 8v8l9 5 9-5V8M12 13v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Layout</span>
  </a>
  <a href="#/graphics" data-tab="graphics">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Graphics</span>
  </a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button type="button" id="toastAction" hidden></button>
</div>

<dialog class="sheet" id="iosSheet" aria-labelledby="iosTitle">
  <h2 id="iosTitle">Add TaniSim to your Home Screen</h2>
  <ol class="ios-steps">
    <li><span class="step-n">1</span>Tap <strong>Share</strong>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-label="Share icon"><path d="M12 15V3m0 0L8 7m4-4 4 4M6 11H5v10h14V11h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      in Safari's toolbar</li>
    <li><span class="step-n">2</span>Choose <strong>Add to Home Screen</strong></li>
    <li><span class="step-n">3</span>Tap <strong>Add</strong>. TaniSim opens full screen and works offline.</li>
  </ol>
  <form method="dialog"><button class="btn">Got it</button></form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
